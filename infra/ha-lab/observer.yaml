apiVersion: v1
kind: ServiceAccount
metadata:
  name: kardia-observer
  namespace: kardia
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kardia-observer
  namespace: kardia
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kardia-observer
  namespace: kardia
subjects:
  - kind: ServiceAccount
    name: kardia-observer
    namespace: kardia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kardia-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kardia-lab-observer
rules:
  - apiGroups: ["", metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kardia-lab-observer
subjects:
  - kind: ServiceAccount
    name: kardia-observer
    namespace: kardia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kardia-lab-observer
