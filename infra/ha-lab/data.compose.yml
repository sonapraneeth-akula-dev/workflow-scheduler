name: kardia-ha-lab-data

services:
  postgres:
    image: postgres:18.6-alpine
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
    entrypoint: ["sh", "/scripts/postgres.sh"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
      - database_password
    volumes:
      - postgres:/var/lib/postgresql
      - postgres-tls:/run/kardia-postgres
      - "${KARDIA_DATA_ROOT:?Use data.ps1}/certs:/certs:ro"
      - "./postgres.sh:/scripts/postgres.sh:ro"
      - "./postgres-init.sh:/docker-entrypoint-initdb.d/10-kardia.sh:ro"
      - "./pg_hba.conf:/scripts/pg_hba.conf:ro"
    ports:
      - "127.0.0.1:55432:5432"
      - "${KARDIA_DATA_ADDRESS:?Use data.ps1}:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 60s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
    entrypoint: ["sh", "/scripts/azurite.sh"]
    secrets:
      - blob_key
    volumes:
      - blobs:/data
      - "./azurite.sh:/scripts/azurite.sh:ro"
    restart: unless-stopped

  blob-tls:
    image: caddy:2.11.7-alpine
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
    volumes:
      - "./Caddyfile.data:/etc/caddy/Caddyfile:ro"
      - "${KARDIA_DATA_ROOT:?Use data.ps1}/certs:/certs:ro"
    ports:
      - "127.0.0.1:55443:8443"
      - "${KARDIA_DATA_ADDRESS:?Use data.ps1}:55443:8443"
    depends_on:
      - azurite
    restart: unless-stopped

secrets:
  postgres_password:
    file: "${KARDIA_DATA_ROOT:?Use data.ps1}/secrets/postgres-password"
  database_password:
    file: "${KARDIA_DATA_ROOT:?Use data.ps1}/secrets/database-password"
  blob_key:
    file: "${KARDIA_DATA_ROOT:?Use data.ps1}/secrets/blob-key"

volumes:
  postgres:
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
  postgres-tls:
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
  blobs:
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"

networks:
  default:
    labels:
      io.kardia.lab: "${KARDIA_LAB_ID:?Use data.ps1}"
