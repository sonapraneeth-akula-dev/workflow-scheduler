name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/Wf.slnx --configuration Release
      - run: dotnet test backend/Wf.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet run --file backend/samples/workflows/scenario-a.cs
