name: Backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ankane/setup-postgres@v1
        if: runner.os == 'Windows'
        with:
          postgres-version: 17
      - name: Configure Windows service PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"WF_TEST_POSTGRES=Host=localhost;Username=postgres;Database=postgres" >> $env:GITHUB_ENV'
      - run: dotnet build backend/Wf.slnx --configuration Release
      - name: Publish native agent
        run: dotnet publish backend/src/Wf.Agent --configuration Release -r ${{ matrix.rid }} -o "${{ runner.temp }}/wf-agent"
      - name: Configure native executable smoke test
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          "WF_AGENT_EXECUTABLE=${{ runner.temp }}/wf-agent/wf-agent$suffix" >> $env:GITHUB_ENV
      - run: dotnet test backend/Wf.slnx --configuration Release --no-build --filter "Category!=Nightly&Category!=ChaosSmoke&Category!=Performance" --collect:"XPlat Code Coverage"
      - name: Install and start Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "wf-agent-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          $directory = Join-Path $env:ProgramData "Kardia\Agents\$name"
          if ((Get-Service -Name $name -ErrorAction SilentlyContinue) -or (Test-Path -LiteralPath $directory)) {
            throw "CI service installation already exists."
          }
          try {
            & .\infra\agent\install-agent.ps1 -Executable $env:WF_AGENT_EXECUTABLE -Engines http://localhost:5000 -ServiceName $name -AgentName $name
            if ((Get-Service -Name $name).Status -ne 'Running') { throw 'Agent service is not running.' }
          } finally {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) {
              Stop-Service -Name $name
              Remove-Service -Name $name
            }
            foreach ($file in @('wf-agent.exe', 'appsettings.json')) {
              $path = Join-Path $directory $file
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }
            }
            if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory }
          }
      - name: Install and start systemd service
        if: runner.os == 'Linux'
        env:
          AGENT_BINARY: ${{ env.WF_AGENT_EXECUTABLE }}
        run: |
          test ! -e /etc/systemd/system/wf-agent.service
          test ! -e /etc/kardia/wf-agent.env
          test ! -e /opt/kardia/wf-agent/wf-agent
          cleanup() {
            if systemctl cat wf-agent.service >/dev/null 2>&1; then sudo systemctl disable --now wf-agent.service; fi
            sudo rm -f /etc/systemd/system/wf-agent.service /etc/kardia/wf-agent.env /opt/kardia/wf-agent/wf-agent
            sudo systemctl daemon-reload
          }
          trap cleanup EXIT
          sudo bash infra/agent/install-agent.sh --executable "$AGENT_BINARY" --engine http://localhost:5000 --name ci-linux
          sudo systemctl is-active --quiet wf-agent.service
      - run: dotnet run --file backend/samples/workflows/scenario-a.cs
