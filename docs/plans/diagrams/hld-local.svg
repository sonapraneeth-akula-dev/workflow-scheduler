<div class="legend">
<section><h2>Connections</h2><ul><li><svg xmlns="http://www.w3.org/2000/svg" class="lg-line" width="44" height="12" aria-hidden="true"><path class="link c-sync" d="M1,6 H36" marker-end="url(#m-arrow)"/></svg> Synchronous call (HTTPS, SQL)</li><li><svg xmlns="http://www.w3.org/2000/svg" class="lg-line" width="44" height="12" aria-hidden="true"><path class="link c-duplex" d="M6,6 H36" marker-start="url(#m-arrow)" marker-end="url(#m-arrow)"/></svg> Bidirectional stream (gRPC, WebSocket, UDS)</li><li><svg xmlns="http://www.w3.org/2000/svg" class="lg-line" width="44" height="12" aria-hidden="true"><path class="link c-bulk" d="M1,6 H36" marker-end="url(#m-bulk)"/></svg> Bulk data (uploads, load traffic)</li><li><svg xmlns="http://www.w3.org/2000/svg" class="lg-line" width="44" height="12" aria-hidden="true"><path class="link c-telemetry" d="M1,6 H36" marker-end="url(#m-arrow)"/></svg> Telemetry (logs, metrics, traces)</li></ul></section>
<section><h2>Component roles</h2><ul><li><span class="swatch" style="--accent:var(--c-client)"></span> Client / actor</li><li><span class="swatch" style="--accent:var(--c-edge)"></span> Edge &amp; identity</li><li><span class="swatch" style="--accent:var(--c-compute)"></span> Compute / process</li><li><span class="swatch" style="--accent:var(--c-data)"></span> Data store</li><li><span class="swatch" style="--accent:var(--c-observe)"></span> Observability</li><li><span class="swatch" style="--accent:var(--c-ext)"></span> External system</li></ul></section>
<section><h2>Shape language</h2><ul class="split"><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-batch-job"/></svg> Job: task host / one-shot job</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-browser"/></svg> Window: browser</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-dashboard"/></svg> Panel: dashboard</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-database"/></svg> Cylinder: database / table</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-desktop"/></svg> Monitor: developer tooling</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-external"/></svg> Plug: system outside the platform</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-file-storage"/></svg> Folder: file-system storage</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-monolith"/></svg> Block: combined process</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-proxy"/></svg> Relay: dev proxy</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-vault"/></svg> Vault: secrets store</li><li><svg xmlns="http://www.w3.org/2000/svg" class="sd-icon"><use href="#sd-worker"/></svg> Gear: agent</li></ul></section>
<section><h2>Notation</h2><ul><li><span class="lg-zone"></span> Boundary: hosts, network, region or domain</li><li><span class="lg-sub">abc</span> Sub-label: count, product or key property</li></ul></section>
</div>
