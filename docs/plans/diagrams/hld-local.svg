<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1354" height="1004" viewBox="0 0 1354 1004">

<foreignObject x="0" y="0" width="1354" height="1004">
<style xmlns="http://www.w3.org/1999/xhtml">:root { --canvas: #ffffff; --surface: #f8fafc; --ink: #0f172a; --ink-2: #475569; --ink-3: #94a3b8; --edge: #cbd5e1; --sync: #2563eb; --async: #7c3aed; --data: #0d9488; --telemetry: #94a3b8; --bulk: #b45309; --fail: #dc2626; --c-client: #0369a1; --c-edge: #7c3aed; --c-compute: #2563eb; --c-data: #0d9488; --c-async: #c2410c; --c-observe: #64748b; }
* { box-sizing: border-box; }
body { margin: 0px; background: rgb(238, 242, 246); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.sd-root { width: 1564px; padding: 32px; background: var(--canvas); border: 1px solid var(--edge); border-radius: 8px; }
.sd-head { margin-bottom: 24px; }
.sd-head h1 { margin: 0px 0px 6px; font-size: 24px; font-weight: 650; letter-spacing: 0px; }
.sd-head p { margin: 0px; font-size: 14px; color: var(--ink-2); }
.sd-canvas { position: relative; width: 1500px; height: 600px; }
.sd-links { position: absolute; inset: 0px; width: 1500px; height: 600px; z-index: 0; }
.zone { position: absolute; left: var(--x); top: var(--y); width: var(--w); height: var(--h); border: 1.5px dashed var(--edge); border-radius: 10px; background: rgba(148, 163, 184, 0.06); z-index: 0; }
.zone-label { position: absolute; left: calc(var(--x) + 14px); top: calc(var(--y) - 11px); display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; background: var(--canvas); border: 1px solid var(--edge); border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); z-index: 2; }
.zone-label .sd-icon { width: 13px; height: 13px; }
.node { position: absolute; left: var(--x); top: var(--y); width: 180px; height: 92px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 14px; background: var(--canvas); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 4px solid var(--accent, var(--edge)); border-radius: 8px; box-shadow: rgba(15, 23, 42, 0.06) 0px 1px 2px; z-index: 1; }
.node-icon { color: var(--accent); line-height: 0; margin-bottom: 4px; }
.sd-icon { width: 24px; height: 24px; fill: none; stroke: currentcolor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.node-title { font-size: 14px; font-weight: 620; line-height: 1.2; }
.node-sub { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.n-client { --accent: var(--c-client); }
.n-edge { --accent: var(--c-edge); }
.n-compute { --accent: var(--c-compute); }
.n-data { --accent: var(--c-data); }
.n-async { --accent: var(--c-async); }
.n-observe { --accent: var(--c-observe); }
.link { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.c-sync { stroke: var(--sync); }
.c-duplex { stroke: var(--data); }
.c-async { stroke: var(--async); stroke-dasharray: 7, 5; }
.c-telemetry { stroke: var(--telemetry); stroke-dasharray: 1, 5; stroke-width: 2; }
.c-replicate { stroke: var(--data); stroke-dasharray: 11, 4, 2, 4; }
.c-bulk { stroke: var(--bulk); stroke-width: 3.5; }
.c-fail { stroke: var(--fail); }
.link-label { font-family: "Segoe UI", -apple-system, sans-serif; font-size: 11px; font-weight: 550; fill: var(--ink-2); paint-order: stroke; stroke: var(--canvas); stroke-width: 5px; stroke-linejoin: round; }
.seq circle { fill: var(--canvas); stroke: var(--sync); stroke-width: 1.5; }
.seq text { font-family: "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: var(--sync); text-anchor: middle; dominant-baseline: central; }
.legend { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--edge); display: grid; grid-template-columns: repeat(4, max-content); gap: 44px; }
.legend h2 { margin: 0px 0px 11px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.legend ul { margin: 0px; padding: 0px; list-style: none; display: grid; gap: 8px; }
.legend ul.split { grid-template-columns: repeat(2, max-content); column-gap: 26px; }
.legend li { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }
.legend .sd-icon { width: 17px; height: 17px; flex: 0 0 auto; color: var(--ink-3); }
.lg-line { flex: 0 0 auto; overflow: visible; }
.swatch { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 3px; background: var(--surface); border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left: 4px solid var(--accent); }
.lg-zone { flex: 0 0 auto; width: 22px; height: 15px; border-radius: 4px; border: 1.5px dashed var(--edge); background: rgba(148, 163, 184, 0.06); }
.lg-sub { flex: 0 0 auto; width: 22px; font-size: 10px; color: var(--ink-3); }
:root { --c-ext: #be185d; }
.n-ext { --accent: var(--c-ext); }
.node { border-top-color: ; border-top-style: ; border-top-width: ; border-right-color: ; border-right-style: ; border-right-width: ; border-bottom-color: ; border-bottom-style: ; border-bottom-width: ; border-left-color: ; border-left-style: ; border-image-source: ; border-image-slice: ; border-image-width: ; border-image-outset: ; border-image-repeat: ; border-left-width: 5px; box-shadow: rgba(15, 23, 42, 0.14) 0px 1px 4px; }
.zone { border-color: rgb(148, 163, 184); }
.node.tbl { width: var(--w); height: var(--h); justify-content: flex-start; padding: 8px 12px; gap: 1px; }
.tbl .node-title { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; margin-bottom: 3px; }
.tbl .col { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px; color: var(--ink-2); line-height: 15px; white-space: nowrap; }
.tbl .k { display: inline-block; width: 30px; font-weight: 700; color: var(--accent); }
.zone-label.right { left: auto; right: calc(100% - var(--x) - var(--w) + 14px); }
.sd-root { width: 1354px; }
.sd-canvas, .sd-links { width: 1290px; height: 640px; }</style>
<div class="sd-root" data-diagram-root="" aria-label="Local profile: browser and wf CLI talk to wf-host, which runs api and engine roles in one process, backed by PostgreSQL, filesystem blobs and local secrets; local agents run task hosts that load the sample services." xmlns="http://www.w3.org/1999/xhtml">
